<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisor de PowerPoint</title>
    <link rel="stylesheet" href="static/styles.css">
    <script defer src="static/script.js"></script>
</head>
<body>
    <div class="container">
        <h2>PPTX Slice</h2>
        
        <form id="pptxForm" enctype="multipart/form-data">
            <label for="file">Escolha um arquivo PowerPoint:</label>
            <input type="file" id="file" name="file" accept=".pptx" required>
            <br><br>

            <label for="divisions">Quantas partes deseja dividir?</label>
            <input type="number" id="divisions" name="divisions" min="1" value="1">
            <br><br>

            <div id="slideInputs" class="scrollable-container"></div>

            <button type="submit" class="execute-btn">Executar</button>
        </form>

        <div id="alertBox" style="display: none; color: red; margin-top: 10px;"></div>
    </div>
</body>
</html>
